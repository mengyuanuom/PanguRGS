DATA:
  dataset: GraspTool
  root_path: ./datasets/grasp-tools/aug_graspall_v2
  train_split: train
  val_split: val
  offset_r: 20
  offset_sigma:
  dynamic_train_prompts: True
  dynamic_prompt_seed: 2025
MODEL:
  architecture: pangu_etrg
TRAIN:
  version: multiple
  etrg_input_mode: rgb
  use_grasp_masks: True
  clip_pretrain: pretrain/RN50.pt
  depth_pretrain: pretrain/resnet18-f37072fd.pth
  depth_backbone_pretrained: False
  depth_normalization: inverse_max
  input_size: 416
  word_len: 32
  word_dim: 1024
  ladder_dim: 64
  nhead: 4
  multi_stage: 3
  vis_dim: 512
  fpn_in: [512, 1024, 1024]
  fpn_out: [256, 512, 1024]
  sync_bn: False
  num_layers: 3
  num_head: 8
  dim_ffn: 512
  dropout: 0.1
  intermediate: False
  workers: 4
  workers_val: 2
  epochs: 36
  milestones: [30]
  start_epoch: 0
  batch_size: 32
  batch_size_val: 32
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 1.0
  weight_decay: 0.01
  max_norm: 0.0
  manual_seed: 0
  print_freq: 100
  amp: False
  optimizer: adam
  optimizer_foreach: False
  pin_memory: False
  exp_name: pangu_etrg_grasp_tools_8npu
  output_folder: exp/grasp_tools
  save_freq: 0
  val_freq: 1
  val_start_epoch: 11
  save_epochs: [5, 10]
  weight:
  resume:
  evaluate: True
Distributed:
  dist_url: env://
  dist_backend: hccl
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  test_split: test
  evaluation_protocol: crog_legacy
  test_batch_size: 32
  test_workers: 2
  grasp_size_activation: auto
  restore_grasp_size_scale: True
  visualize: False
