DATA:
  dataset: GraspTool
  root_path: ./datasets/grasp-tools/aug_graspall_v2
  train_split: train
  val_split: val
  offset_r: 20
  offset_sigma:
  dynamic_train_prompts: True
  dynamic_prompt_seed: 2025
MODEL:
  architecture: pangu_drogoff
TRAIN:
  version: multiple
  visual_adapter_dim: 128
  visual_adapter_layer: [1, 3, 5, 7, 9, 11]
  txt_adapter_dim: 64
  txtual_adapter_layer: [1, 3, 5, 7, 9, 11]
  clip_pretrain: pretrain/ViT-B-16.pt
  dino_pretrain: pretrain/dinov2_vitb14_reg4_pretrain.pth
  dino_layers: 12
  output_dinov2: [4, 8]
  dino_name: dino-base
  model_name: CLIP-b-16
  input_size: 448
  word_len: 32
  word_dim: 512
  ladder_dim: 128
  nhead: 8
  multi_stage: 3
  stride: [1, 1, 1]
  vis_dim: 512
  fpn_in: [768, 768, 768]
  fpn_out: [256, 512, 1024]
  sync_bn: False
  # The dynamic grouped-convolution projector has an invalid NPU AMP backward
  # path (128-vs-32 shape mismatch). Keep this model in stable FP32 mode.
  amp: False
  find_unused_parameters: False
  optimizer: adam
  pin_memory: False
  projector: dynamic
  num_layers: 3
  num_head: 8
  dim_ffn: 512
  dropout: 0.1
  intermediate: False
  workers: 4
  workers_val: 2
  epochs: 36
  milestones: [30]
  start_epoch: 0
  batch_size: 32  # single-card batch size
  batch_size_val: 32
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 1
  weight_decay: 0.0
  max_norm: 0.0
  manual_seed: 0
  print_freq: 100
  exp_name: pangu_drogoff_grasp_tools_8npu
  offset_loss_weight: 1.0
  output_folder: exp/grasp_tools
  save_freq: 0
  val_freq: 1
  val_start_epoch: 11
  save_epochs: [5, 10]
  weight:
  resume:
  evaluate: True
  use_grasp_masks: True
Distributed:
  dist_url: env://
  dist_backend: hccl
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  test_split: test
  evaluation_protocol: crog_legacy
  test_batch_size: 32
  test_workers: 2
  grasp_size_activation: auto
  restore_grasp_size_scale: True
  use_offset_at_inference: True
  filter_grasps_by_segmentation: False
  offset_resample_geometry: True
  visualize: False
