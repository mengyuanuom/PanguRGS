DATA:
  dataset: OCID-VLG
  root_path: ./datasets/OCID-VLG
  with_depth: False
  train_split: train
  val_split: val
  offset_r: 20
  offset_sigma:
MODEL:
  architecture: drogoff
TRAIN:
  version: multiple
  visual_adapter_dim: 128
  visual_adapter_layer: [1,3,5,7,9,11]
  txt_adapter_dim: 64
  txtual_adapter_layer: [1,3,5,7,9,11]
  # Base Arch
  clip_pretrain: pretrain/ViT-B-16.pt
  dino_pretrain: pretrain/dinov2_vitb14_reg4_pretrain.pth
  dino_layers: 12
  output_dinov2: [4, 8]
  dino_name: dino-base
  model_name: CLIP-b-16
  input_size: 448
  word_len: 17
  word_dim: 512
  ladder_dim: 128
  nhead: 8
  multi_stage: 3
  stride: [1, 1, 1]
  vis_dim: 512
  fpn_in: [768, 768, 768] #dinov2 backbone
  fpn_out: [256, 512, 1024]

  sync_bn: False
  amp: False
  optimizer: adam
  pin_memory: False
  projector: dynamic
  # Decoder
  num_layers: 3
  num_head: 8
  dim_ffn: 512
  dropout: 0.1
  intermediate: False

  # Training Setting
  # Conservative per-process profile for two accelerators.
  workers: 4  # per process; 32 workers total with eight NPUs
  workers_val: 2
  epochs: 24
  milestones: [20]
  start_epoch: 0
  batch_size: 32  # global train batch size; 4 samples per process on 8 NPUs
  batch_size_val: 32  # global validation batch size
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 1
  weight_decay: 0.
  max_norm: 0.
  manual_seed: 0
  print_freq: 100
  # Resume & Save
  exp_name: drogoff_no_offset_ocid_vlg_8npu
  offset_loss_weight: 1.0
  output_folder: exp/OCID-VLG
  save_freq: 0
  val_freq: 1
  val_start_epoch: 11
  save_epochs: [5, 10]
  weight:  # path to initial weight (default: none)
  resume: # path to latest checkpoint (default: none)
  evaluate: True
  use_grasp_masks: True # evaluate on validation set, extra NPU memory needed and small batch_size_val is recommend
Distributed:
  dist_url: env://
  dist_backend: 'hccl'
  multiprocessing_distributed: True
  world_size: 1
  rank: 0

TEST:
  test_split: test
  evaluation_protocol: crog_legacy
  test_batch_size: 32  # per device; reduce with --opts if memory is limited
  test_workers: 2
  grasp_size_activation: auto
  use_offset_at_inference: False
  filter_grasps_by_segmentation: False
  offset_resample_geometry: False
  visualize: False
